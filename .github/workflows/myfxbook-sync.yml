name: Myfxbook performance sync

# After a collection, rebuild the pages that carry performance figures.
#
# This workflow does not collect anything. Collection needs a real browser from a
# residential connection — Myfxbook 403s both plain server-side fetches and GitHub's
# runner IPs — so it runs locally via scripts/local/collect-myfxbook.cmd, which POSTs
# to the app's token-guarded ingest endpoint. What is left here is the half that can
# run anywhere: read D1, write src/data/myfxbook-live.json, rebuild, deploy.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   Workers Scripts: Edit + D1: Read
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the bestmt4ea database

on:
  # Dispatch-only, and deliberately so. Collection cannot run here at all: Myfxbook
  # returns 403 to GitHub's runner IPs, so a `collect` job and a `schedule:` could only
  # ever burn ~13 minutes and fail. Collection runs from a normal connection instead —
  # scripts/local/collect-myfxbook.cmd -> the token-guarded ingest endpoint -> D1.
  #
  # Everything below is a pure D1 reader, so it cannot be blocked and needs no browser.
  # It is the only step that has to run after a collection. A deploy from a developer
  # machine refreshes the same file through the `predeploy` hook, which is why the two
  # paths cannot drift apart.
  workflow_dispatch: {}

concurrency:
  group: myfxbook-sync
  cancel-in-progress: false

jobs:
  # The collector only fills the database. The prerendered pages — homepage, /shop/,
  # /top-ranking/, the header column, the promo, the product cards — are built from
  # src/data/myfxbook-live.json, so without this job they keep whatever figures they
  # were last built with. This reads the newest snapshot per account out of D1,
  # writes that file, and rebuilds and deploys.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish the newest figures into the build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-myfxbook.mjs

      # PUBLIC_ADSENSE_CLIENT is inlined at build time, so a build without it ships
      # pages with no ad units. The value is public — it is in every served page.
      - name: Build
        env:
          PUBLIC_ADSENSE_CLIENT: ca-pub-3205201421095170
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
