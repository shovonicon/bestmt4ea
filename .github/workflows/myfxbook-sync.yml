name: Myfxbook performance sync

# Drives the scheduled collector: a headless browser reads each public Myfxbook
# account page and POSTs a snapshot to the app's ingest endpoint. Myfxbook 403s
# plain server-side fetches, which is why this runs in a real browser rather
# than inside the Cloudflare Worker.
#
# Required repository secrets:
#   BESTMT4EA_INGEST_URL  e.g. https://bestmt4ea.com
#   PERF_INGEST_TOKEN     the same secret the Worker holds
#   MYFXBOOK_SESSION      optional; enables the monthly breakdown (403s anonymously)

on:
  schedule:
    # Once every 24 hours. Product pages are server-rendered and read the newest
    # snapshot per request (5-minute edge cache), so one run a day is all the
    # freshness the live figures need. The monthly chart Myfxbook serves is
    # intermittent, so a missed month on one run is recovered on the next.
    - cron: '0 0 * * *' # daily, 00:00 UTC
  workflow_dispatch: {}

concurrency:
  group: myfxbook-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect and ingest
        env:
          INGEST_URL: ${{ secrets.BESTMT4EA_INGEST_URL }}
          PERF_INGEST_TOKEN: ${{ secrets.PERF_INGEST_TOKEN }}
          MYFXBOOK_SESSION: ${{ secrets.MYFXBOOK_SESSION }}
        run: node scripts/collect-myfxbook.mjs

  # The collector only fills the database. The prerendered pages — homepage, /shop/,
  # /top-ranking/, the header column, the promo, the product cards — are built from
  # src/data/myfxbook-live.json, so without this job they keep whatever figures they
  # were last built with. This reads the newest snapshot per account out of D1,
  # writes that file, and rebuilds and deploys.
  publish:
    needs: collect
    # Runs even when some accounts were rate-limited: a partial refresh beats none.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish the newest figures into the build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-myfxbook.mjs

      # PUBLIC_ADSENSE_CLIENT is inlined at build time, so a build without it ships
      # pages with no ad units. The value is public — it is in every served page.
      - name: Build
        env:
          PUBLIC_ADSENSE_CLIENT: ca-pub-3205201421095170
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
