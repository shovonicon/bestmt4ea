name: Licence build queue

# Compiles each queued per-account EA build and attaches it to the customer's
# licence, after which they can download it from /dashboard/downloads/.
#
# Why Windows: an .ex4/.ex5 can only be produced by MetaQuotes' MetaEditor, and
# MT5's MetaEditor will NOT compile MQL4 — verified locally, it fails with
# "error 208: unsupported file extension". So this needs a real MT4 terminal,
# which MetaQuotes ships through brokers, hence the installer is attached to the
# `tools-mt4` release (an optional MT4_INSTALLER_URL secret overrides it).
#
# Required repository secrets:
#   BESTMT4EA_APP_URL    app origin, e.g. https://bestmt4ea.com
#   CRON_SECRET          the same secret the Worker holds
#
# FIRST RUN: watch it. The silent install switch is standard for MetaQuotes
# installers but the resulting path varies by broker, so the step below reports
# what it found. If the compile step cannot find MetaEditor, set METAEDITOR in
# the workflow to the path that step printed.

on:
  # On demand — the app can fire a repository_dispatch the moment a licence is
  # activated, which is when a build is actually needed — plus a safety net.
  #
  # Do NOT poll aggressively: Windows runners bill at 2x, so a 15-minute schedule
  # (~96 runs/day) would burn roughly 23,000 billed minutes a month against a
  # 2,000-minute free allowance. Every 6 hours is about 960.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [license-build]

concurrency:
  group: license-builds
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install MetaTrader 4 (provides MetaEditor)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MT4_INSTALLER_URL: ${{ secrets.MT4_INSTALLER_URL }}
        run: |
          # The installer is attached to the public `tools-mt4` release. An
          # MT4_INSTALLER_URL secret, when set, overrides it.
          $installer = Join-Path $env:RUNNER_TEMP 'mt4setup.exe'
          if ($env:MT4_INSTALLER_URL) {
            Invoke-WebRequest -Uri $env:MT4_INSTALLER_URL -OutFile $installer
          } else {
            gh release download tools-mt4 --pattern 'exness4setup.exe' --output $installer --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not download exness4setup.exe from the tools-mt4 release.' }
          }
          Start-Process -FilePath $installer -ArgumentList '/auto' -Wait

          # The install directory is broker-branded, so find MetaEditor rather than
          # assuming a path, and hand it to the build step.
          $metaeditor = Get-ChildItem 'C:\Program Files (x86)', 'C:\Program Files' `
            -Recurse -Filter 'metaeditor.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $metaeditor) { throw 'MT4 installed but no metaeditor.exe was found.' }
          Write-Host "MetaEditor: $metaeditor"
          "METAEDITOR=$metaeditor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install MetaTrader 5 (provides the MT5 MetaEditor)
        shell: pwsh
        run: |
          # MT5's editor is not interchangeable with MT4's: each compiles only its
          # own language. MetaQuotes ships MT5 itself, so unlike MT4 there is no
          # broker in the path and no secret needed.
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/auto' -Wait

          $mt5 = Get-ChildItem 'C:\Program Files', 'C:\Program Files (x86)' `
            -Recurse -Include 'metaeditor64.exe', 'metaeditor.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'MetaTrader 5' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $mt5) { throw 'MT5 installed but no MetaEditor was found.' }
          Write-Host "MT5 MetaEditor: $mt5"
          "METAEDITOR_MT5=$mt5" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Initialise the MetaTrader data folders
        shell: pwsh
        run: |
          # A fresh install has never run its terminal, so the standard libraries
          # (Include\stdlib.mqh, Include\Trade\Trade.mqh) do not exist yet and every
          # compile fails with error 106. Start each terminal once in portable mode
          # so it unpacks them, then stop it.
          foreach ($exe in @($env:METAEDITOR, $env:METAEDITOR_MT5)) {
            $dir = Split-Path $exe -Parent
            $terminal = Get-ChildItem $dir -Filter 'terminal*.exe' | Select-Object -First 1
            if (-not $terminal) { throw "No terminal executable next to $exe" }
            $p = Start-Process -FilePath $terminal.FullName -ArgumentList '/portable' -PassThru
            Start-Sleep -Seconds 45
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-ChildItem $dir -Recurse -Include 'stdlib.mqh', 'Trade.mqh' -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "found: $($_.FullName)" }
          }

      - name: Build queued licences
        env:
          MQL_PORTABLE: '1'
          APP_URL: ${{ secrets.BESTMT4EA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/build-licenses.mjs
